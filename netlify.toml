[build]
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/logo.png"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[redirects]]
  from = "/about"
  to = "/om-os"
  status = 301

[[redirects]]
  from = "/trust"
  to = "/sikkerhed"
  status = 301

[[redirects]]
  from = "/privacy"
  to = "/privatlivspolitik"
  status = 301

[[redirects]]
  from = "/terms"
  to = "/servicevilkaar"
  status = 301
